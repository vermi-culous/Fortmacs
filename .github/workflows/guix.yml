name: Guix

# Weekly, and on demand: build and test with the latest Guix toolchain.
# Too slow for every PR (it pulls Guix and fetches the toolchain); style
# is checked by the main CI.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FPM_VERSION: "0.13.0"
  FPM_SHA256: "001cff6cf1145f215baa0888ba27acc06cea30a89b79d1a8be97db3fffbc8cd2"

jobs:
  check:
    name: check (guix, x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Install Guix
        run: |
          # The project's own link to the current installer (the
          # repository moved from Savannah to Codeberg).
          curl -sSLf --retry 3 -o guix-install.sh "https://guix.gnu.org/install.sh"
          chmod +x guix-install.sh
          # Accept the defaults, including substitutes from the build farm.
          yes | sudo ./guix-install.sh
          guix --version | sed -n 1p

      - name: Update Guix
        # Pull from Codeberg, the repository's home since 2025; the
        # installed (older) Guix still defaults to Savannah.
        run: guix pull --url=https://codeberg.org/guix/guix.git && hash guix && guix describe

      - name: Build and test in a Guix environment
        # nss-certs gives curl and git (for fpm's dependencies) the CA
        # bundle that the profile builds.
        run: |
          guix shell gfortran-toolchain valgrind curl git nss-certs coreutils bash grep sed \
            findutils ncurses -- bash -euc '
              export SSL_CERT_DIR="$GUIX_ENVIRONMENT/etc/ssl/certs"
              export SSL_CERT_FILE="$SSL_CERT_DIR/ca-certificates.crt"
              export GIT_SSL_CAINFO="$SSL_CERT_FILE"
              gfortran --version | sed -n 1p
              curl -sSLf -o fpm.F90 \
                "https://github.com/fortran-lang/fpm/releases/download/v${FPM_VERSION}/fpm-${FPM_VERSION}.F90"
              echo "${FPM_SHA256}  fpm.F90" | sha256sum -c -
              mkdir -p "$HOME/.local/bin" fpm-mod
              gfortran -O1 -fopenmp -J fpm-mod -o "$HOME/.local/bin/fpm" fpm.F90
              rm -rf fpm.F90 fpm-mod
              export PATH="$HOME/.local/bin:$PATH"
              tools/check.sh --valgrind --no-style'
